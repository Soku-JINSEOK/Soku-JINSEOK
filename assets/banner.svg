<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Subtle Accent Glow -->
    <radialGradient id="cyan-glow" cx="85%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="1200" height="300" rx="10" fill="url(#bg-gradient)" stroke="#30363d" stroke-width="1.5" />
  <rect width="1200" height="300" rx="10" fill="url(#cyan-glow)" />
  <rect width="1200" height="300" rx="10" fill="url(#grid)" opacity="0.75" />

  <!-- Top Status Bar & Metadata -->
  <g transform="translate(60, 48)">
    <circle cx="0" cy="0" r="4.5" fill="#3fb950" />
    <text x="14" y="4.5" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">ENGINEERING PROFILE // CLOUD · AUTOMATION · DATA · WEB</text>
  </g>

  <!-- Left: Main Identity Typography -->
  <g transform="translate(60, 140)">
    <text x="0" y="0" fill="#f0f6fc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="0.5">JINSEOK SEOK</text>
    <text x="0" y="38" fill="#38bdf8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">Software &amp; DX Engineer</text>
    <text x="0" y="74" fill="#8b949e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Bridging operational requirements with maintainable software &amp; safe automation</text>
  </g>

  <!-- Right: Abstract Architecture & Systems Nodes -->
  <g transform="translate(840, 50)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Connecting Vector Lines -->
    <path d="M 60 80 L 160 40 L 260 80 L 260 160 L 160 200 L 60 160 Z" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="4,4" />
    <path d="M 60 80 L 160 120 L 260 80" fill="none" stroke="#21262d" stroke-width="1.5" />
    <path d="M 160 120 L 160 200" fill="none" stroke="#21262d" stroke-width="1.5" />
    <path d="M 60 160 L 160 120 L 260 160" fill="none" stroke="#21262d" stroke-width="1.5" />

    <line x1="160" y1="40" x2="160" y2="120" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
    <line x1="60" y1="160" x2="160" y2="200" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.8" />

    <!-- Node 1: Top Core -->
    <circle cx="160" cy="40" r="18" fill="#161b22" stroke="#38bdf8" stroke-width="2" />
    <circle cx="160" cy="40" r="6" fill="#38bdf8" />

    <!-- Node 2: Center Hub -->
    <rect x="135" y="95" width="50" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
    <circle cx="160" cy="120" r="5" fill="#58a6ff" />

    <!-- Node 3: Left Ingress -->
    <circle cx="60" cy="80" r="14" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="60" cy="80" r="4" fill="#8b949e" />

    <!-- Node 4: Left Egress -->
    <circle cx="60" cy="160" r="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" />
    <circle cx="60" cy="160" r="4" fill="#58a6ff" />

    <!-- Node 5: Right Ingress -->
    <circle cx="260" cy="80" r="14" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="260" cy="80" r="4" fill="#8b949e" />

    <!-- Node 6: Right Egress -->
    <circle cx="260" cy="160" r="14" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="260" cy="160" r="4" fill="#8b949e" />

    <!-- Node 7: Bottom Target -->
    <circle cx="160" cy="200" r="16" fill="#161b22" stroke="#3fb950" stroke-width="2" />
    <circle cx="160" cy="200" r="5" fill="#3fb950" />

    <!-- Node Labels in Code Font -->
    <text x="160" y="16" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11">INGRESS</text>
    <text x="160" y="234" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11">DELIVERY</text>
  </g>
</svg>
